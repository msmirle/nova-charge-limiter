# Drop-in for Armada's systemd-suspend.service (installed as
# /etc/systemd/system/systemd-suspend.service.d/50-nova-charge-limit.conf).
#
# Before each suspend, nova-charge-limit writes a copy of
# /etc/armada/sleep.conf for suspend-dispatch to read. While the battery
# charges toward the limit, the copy asks for Armada's fake suspend so the
# service keeps running and can stop charging at the limit.
[Service]
Environment=ARMADA_SLEEP_CONFIG=/run/nova-charge-limit-sleep.conf
ExecStartPre=-/usr/bin/bash /var/lib/nova-charge-limit/bin/nova-charge-limit-audio save
ExecStartPre=-/usr/bin/bash /var/lib/nova-charge-limit/bin/nova-charge-limit sleep
# After Armada thaws apps and finishes its own unmute attempt, retry restoring
# the original mute state. Do not restart the audio server or alter its volume.
ExecStopPost=-/usr/bin/bash /var/lib/nova-charge-limit/bin/nova-charge-limit-audio restore
